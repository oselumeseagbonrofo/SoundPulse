[project]
name = "soundpulse-ml"
version = "0.1.0"
description = "ML workspace for the SoundPulse offline environmental sound recognition system"
requires-python = ">=3.11"
dependencies = [
	"ipykernel>=6.29",
	"jupyter>=1.1",
	"kagglehub>=0.3",
	"librosa>=0.10",
	"matplotlib>=3.8",
	"numpy>=1.26",
	"pandas>=2.2",
	"scikit-learn>=1.4",
	"seaborn>=0.13",
	"soundfile>=0.12",
	"tensorflow>=2.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
