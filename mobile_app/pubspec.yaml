name: soundpulse_mobile
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  record: ^6.2.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/config/class_labels.json
    - assets/config/preprocessing_config.json
    - assets/config/threshold_defaults.json
    - assets/models/tiny_cnn/tinycnn_embedding.tflite
    - assets/models/tiny_cnn/prototype_store.json
    - assets/models/yamnet/yamnet_embedding.tflite
    - assets/models/yamnet/prototype_store.json
